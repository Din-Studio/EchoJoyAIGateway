# GPT-Load 集群样例的负载均衡配置。集群模式共享全部请求状态，不需要粘性会话。
upstream gpt_load {
    server gpt-load-1:3001 max_fails=3 fail_timeout=10s;
    server gpt-load-2:3001 max_fails=3 fail_timeout=10s;
    server gpt-load-3:3001 max_fails=3 fail_timeout=10s;
    keepalive 64;
}

# 原生 Responses WebSocket（GET /v1/responses）需要透传 Upgrade；
# 普通请求保持到上游的长连接。
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

server {
    listen 80;

    # 与网关的请求体上限保持同一量级（图片编辑等上传）。
    client_max_body_size 64m;

    location / {
        proxy_pass http://gpt_load;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # 网关用 Host 校验 WebSocket 的 Origin，必须原样透传。
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 与流式响应逐块转发，不在 nginx 缓冲。
        proxy_buffering off;
        proxy_request_buffering off;
        # 长流式生成与 WebSocket 会话。
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
