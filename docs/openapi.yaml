openapi: 3.1.0
info:
  title: EchoJoy AI Gateway 控制面 API
  version: 2.0.0
  license:
    name: MIT
    identifier: MIT
  description: |
    控制面 HTTP 接口，路由前缀为 `/api`。当前收录范围：AccessKey 管理；模型总览、模型价格、分组模型与模型发现。
    数据面接口（`/v1/*`、`/v1beta/*`）不在本文档内。

    ## 鉴权
    所有接口使用 `Authorization: Bearer <token>`。控制面只有两种身份：

    - `admin`：token 等于服务端环境变量 `AUTH_KEY`，可访问全部控制面接口。
    - `access_key`：token 为某个 AccessKey，仅能以 GET 访问只读白名单
      （`/api/auth/session`、`/api/currency`、`/api/home`、`/api/home/statistics`、`/api/models`、`/api/usage`、
      `/api/logs`、`/api/logs/{request_id}`），响应一律带 `Cache-Control: no-store`。

    本文档中除 `GET /api/models`、`GET /api/currency` 外的接口**仅限 `admin`**，AccessKey 调用返回 `403 FORBIDDEN`。
    同一来源 IP 连续认证失败会被临时锁定，返回 `429 AUTH_LOCKED` 并带 `Retry-After`。

    ## 响应包络
    成功：HTTP 200，`{"code": 0, "message": "...", "data": ...}`；无返回体的操作省略 `data`。
    失败：`{"code": "<ERROR_CODE>", "message": "...", "data"?: ...}`，`message` 随
    `Accept-Language` 本地化。

    ## 幂等
    会生成或替换密钥明文的写操作要求 `Idempotency-Key` 请求头（小写规范 UUID v4）。
    相同 key + 相同请求体重放时返回首次结果，`replayed=true`，且**不再返回明文 `key`**。
    相同 key + 不同请求体返回 `409 IDEMPOTENCY_KEY_REUSED`。

    ## 灵影镜像密钥
    灵影通过 `/api/access-keys` 把用户的个人 API Key 镜像为 AccessKey，并通过 `GET /api/models` 读取模型目录。
    控制面不校验下列约定，但数据面按名称前缀识别：

    - 名称以 `ly:` 开头（灵影写为 `ly:<key_id>`）：数据面生成类请求（`/v1/chat/completions`、`/v1/messages`、
      `/v1/responses`）先向灵影查询余额、结束后上报用量。要求系统货币为 `CNY` 且配置了
      `LINGYING_BILLING_BASE_URL`、`LINGYING_BILLING_TOKEN`，否则这些请求被拒绝。
    - 名称以 `ly:default:` 开头且备注非空：该密钥是备注中 EchoJoyAuth 用户 ID 的默认密钥。
      数据面收到该用户的 EchoJoyAuth access token 时，按这把启用中的密钥鉴权、限流和计费。

    ## 请求体
    JSON 请求体严格解析：未知字段、重复字段、多个 JSON 值均拒绝；上限 32 MiB。

    ## 约定
    - 时间戳均为 Unix 毫秒（`*_at_ms`）。
    - 金额均为十进制字符串，币种由同一响应中的 `currency`（ISO 4217，目前为 `USD` 或 `CNY`）给出：
      不带后缀的金额（如 `limit`）是该币种的十进制金额，`*_nano` 是 1e-9 个该币种单位；
      `*_nano_usd` 始终是 1e-9 美元。
    - 存储与计费以美元为准：上游价格恒为美元；每笔请求结算时按当时的系统货币与汇率同时记录美元与本币金额，
      之后修改汇率或切换币种不会改写已发生的费用。系统货币见 `GET /api/currency`。
    - 价格类金额（上游价格、统一价、auto 模型价格）以美元保存，接口按当前汇率换算为系统货币返回，提交时也以系统货币计。
      返回值取「能换算回同一美元存储值的系统货币金额」中小数位最少的一个，因此以系统货币提交的价格读回时与提交值一致，
      原样再提交不会改变存储值。费用金额（`*_nano`）按结算汇率精确换算，不做此处理。
    - 每笔请求计算两笔钱：**费用**（`estimated_cost_*`）= 客户端模型统一价 × AccessKey 倍率，
      用于成本额度与用量统计；**上游费用** = 渠道上游模型价格 × 分组倍率，是网关付给上游的成本，只返回给 admin。
      客户端模型没有统一价时费用按未定价处理，不回退到上游价格；auto 模型按选中的目标模型收费。
      请求日志接口（`/api/logs`，本文档未收录）中，上游费用为条目的 `upstream_cost` 对象；
      日志详情的 `attempts[].pricing_receipt` 是费用明细（规则为 `client_model`），
      `attempts[].upstream_pricing_receipt` 是上游费用明细（规则为 `channel_id` + `model_id`）。AccessKey 身份下两者都不返回。
servers:
  - url: http://localhost:3001
    description: 本地默认端口（`PORT`，默认 3001）
security:
  - adminBearer: []
tags:
  - name: AccessKeys
    description: AccessKey 管理（仅 admin）
  - name: Models
    description: 模型总览（admin 与 AccessKey 均可调用）
  - name: ModelPrices
    description: 上游价格、客户端模型统一价与 models.dev 目录同步（仅 admin）
  - name: GroupModels
    description: 分组的模型列表与别名（仅 admin）
  - name: ModelDiscovery
    description: 从上游发现可用模型（仅 admin）
  - name: Currency
    description: 系统货币（admin 与 AccessKey 均可调用）

paths:
  /api/currency:
    get:
      tags: [Currency]
      operationId: getCurrency
      summary: 读取系统货币
      description: 新请求结算使用的系统货币与汇率（1 USD = `exchange_rate` 个系统货币单位；USD 时为 `1`）。
      security:
        - adminBearer: []
        - accessKeyBearer: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/SystemCurrency' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/AuthLocked' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/access-keys:
    get:
      tags: [AccessKeys]
      operationId: listAccessKeys
      summary: 分页查询 AccessKey
      description: |
        返回汇总、当前页条目与分页信息。每个条目附带最近 7 天用量（窗口见 `usage_window`），
        配置了费用规则的条目附带实时 `cost_limit_status`。
        只接受下列查询参数，出现其他参数或同一参数重复时返回 `400 BAD_REQUEST`。
      parameters:
        - name: q
          in: query
          description: 按名称、备注或掩码密钥做大小写不敏感的包含匹配；首尾空白会被去除。
          schema: { type: string, maxLength: 200 }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/AccessKeyStatus' }
        - name: group_id
          in: query
          description: 只返回可访问该分组的密钥；未限制分组的密钥也会命中。
          schema: { type: integer, minimum: 1 }
        - name: expiry
          in: query
          description: |
            `never` 永不过期；`active` 设置了过期时间且未过期；`expired` 已过期。
          schema: { type: string, enum: [never, active, expired] }
        - name: sort
          in: query
          description: |
            默认按 `updated_at_ms` 倒序。`cost_desc` 按 7 天费用倒序；
            `expires_asc` 按过期时间升序，未设置过期的排最后。
          schema: { type: string, enum: [updated_desc, cost_desc, expires_asc], default: updated_desc }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: page_size
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    required: [data]
                    properties:
                      data: { $ref: '#/components/schemas/AccessKeyCollection' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/AuthLocked' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [AccessKeys]
      operationId: createAccessKey
      summary: 创建 AccessKey
      description: |
        不传 `key` 时服务端生成 `sk-gl-` + 32 位十六进制的密钥。明文 `key` 只在首次成功响应中返回，
        之后需通过 reveal 接口获取。响应带 `Cache-Control: no-store`。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccessKeyCreateRequest' }
            example:
              name: team-a
              note: 负责人 alice，每月轮换
              filters:
                groups: [1]
                protocols: [openai-completions, anthropic]
                models: []
                allowed_cidrs: [10.0.0.0/8]
              rpm_limit: 60
              cost_limit_rules:
                - { kind: total, limit: "100" }
                - { kind: periodic, limit: "5", period_seconds: 86400 }
              expires_at_ms: 1798732800000
      responses:
        '200':
          description: 创建成功或幂等重放
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    required: [data]
                    properties:
                      data: { $ref: '#/components/schemas/AccessKeySecretResult' }
        '400':
          description: |
            `BAD_REQUEST` / `INVALID_JSON` / `VALIDATION_FAILED` / `INVALID_CUSTOM_ACCESS_KEY` /
            `ACCESS_KEY_ADMIN_CONFLICT`（自定义 key 与 `AUTH_KEY` 相同）/ `INVALID_IDEMPOTENCY_KEY`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: |
            `DUPLICATE_RESOURCE`（自定义 key 已被其他 AccessKey 使用）/ `IDEMPOTENCY_KEY_REUSED`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '410': { $ref: '#/components/responses/IdempotencyExpired' }
        '413': { $ref: '#/components/responses/RequestTooLarge' }
        '428': { $ref: '#/components/responses/IdempotencyKeyRequired' }
        '429': { $ref: '#/components/responses/AuthLocked' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/OperationIncomplete' }

  /api/access-keys/options:
    get:
      tags: [AccessKeys]
      operationId: listAccessKeyOptions
      summary: 列出 AccessKey 下拉选项
      description: 返回全部 AccessKey 的精简信息，按 `id` 升序，不分页。用于日志、用量页的筛选下拉框。
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: [array, 'null']
                        items: { $ref: '#/components/schemas/AccessKeyOption' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/AuthLocked' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/access-keys/{id}:
    parameters:
      - $ref: '#/components/parameters/AccessKeyID'
    get:
      tags: [AccessKeys]
      operationId: getAccessKey
      summary: 按 ID 获取 AccessKey
      description: |
        返回单个 AccessKey 的元数据，字段与更新接口的响应一致。
        存在费用规则时附带 `cost_limit_status`；不返回密钥明文，明文请用 reveal 接口。
      responses:
        '200':
          description: AccessKey 元数据
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    required: [data]
                    properties:
                      data: { $ref: '#/components/schemas/AccessKeyMetadata' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/AuthLocked' }
        '500': { $ref: '#/components/responses/InternalError' }
    put:
      tags: [AccessKeys]
      operationId: updateAccessKey
      summary: 更新 AccessKey（部分更新）
      description: |
        只修改请求中出现的字段，至少要有一个字段，否则返回 `400 BAD_REQUEST`。

        - `filters` 整体替换。
        - `cost_limit_rules` 整体替换：带 `id` 的保留并更新该规则，不带 `id` 的新建，
          未出现的已有规则被删除。修改周期会重置该规则的用量。
        - `expires_at_ms` 传 `null` 表示改为永不过期。
        - `note` 传空串（或全空白）表示清空备注。
        - 传入非空 `key` 会替换密钥明文，此时必须带 `Idempotency-Key`；响应不回显明文。
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: 仅当请求体包含非空 `key` 时必填，格式同创建接口。
          schema: { $ref: '#/components/schemas/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccessKeyUpdateRequest' }
            example:
              status: disabled
              expires_at_ms: null
      responses:
        '200':
          description: 更新后的元数据
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    required: [data]
                    properties:
                      data: { $ref: '#/components/schemas/AccessKeyMetadata' }
        '400':
          description: |
            `BAD_REQUEST` / `INVALID_JSON` / `VALIDATION_FAILED` / `INVALID_CUSTOM_ACCESS_KEY` /
            `ACCESS_KEY_ADMIN_CONFLICT` / `INVALID_IDEMPOTENCY_KEY`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`DUPLICATE_RESOURCE` / `IDEMPOTENCY_KEY_REUSED`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '410': { $ref: '#/components/responses/IdempotencyExpired' }
        '413': { $ref: '#/components/responses/RequestTooLarge' }
        '428': { $ref: '#/components/responses/IdempotencyKeyRequired' }
        '429': { $ref: '#/components/responses/AuthLocked' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/OperationIncomplete' }
    delete:
      tags: [AccessKeys]
      operationId: deleteAccessKey
      summary: 删除 AccessKey
      responses:
        '200':
          description: 删除成功，响应不含 `data`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/AuthLocked' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/RecoveryPending' }

  /api/access-keys/{id}/reveal:
    parameters:
      - $ref: '#/components/parameters/AccessKeyID'
    post:
      tags: [AccessKeys]
      operationId: revealAccessKey
      summary: 查看 AccessKey 明文
      description: '解密并返回密钥明文，无请求体。操作会写入审计日志，响应带 `Cache-Control: no-store`。'
      responses:
        '200':
          description: 成功
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    required: [data]
                    properties:
                      data: { $ref: '#/components/schemas/AccessKeyRevealResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/AuthLocked' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/access-keys/{id}/rotate:
    parameters:
      - $ref: '#/components/parameters/AccessKeyID'
    post:
      tags: [AccessKeys]
      operationId: rotateAccessKey
      summary: 轮换 AccessKey
      description: |
        生成新的随机密钥替换旧密钥，旧密钥立即失效；其余配置不变。
        请求体可省略或为 `{}`。明文 `key` 只在首次成功响应中返回。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema: { type: object, additionalProperties: false }
      responses:
        '200':
          description: 轮换成功或幂等重放
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    required: [data]
                    properties:
                      data: { $ref: '#/components/schemas/AccessKeySecretResult' }
        '400':
          description: '`BAD_REQUEST` / `INVALID_JSON` / `INVALID_IDEMPOTENCY_KEY`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/IdempotencyKeyReused' }
        '410': { $ref: '#/components/responses/IdempotencyExpired' }
        '413': { $ref: '#/components/responses/RequestTooLarge' }
        '428': { $ref: '#/components/responses/IdempotencyKeyRequired' }
        '429': { $ref: '#/components/responses/AuthLocked' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/OperationIncomplete' }

  /api/access-keys/{id}/cost-limits/reset:
    parameters:
      - $ref: '#/components/parameters/AccessKeyID'
    post:
      tags: [AccessKeys]
      operationId: resetAccessKeyCostLimits
      summary: 重置费用规则用量
      description: 将指定规则的已用金额清零，规则定义不变。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [rule_ids]
              properties:
                rule_ids:
                  type: array
                  description: 要重置的规则 ID，必须都属于该 AccessKey，不可重复。
                  minItems: 1
                  maxItems: 11
                  uniqueItems: true
                  items: { type: integer, minimum: 1 }
            example: { rule_ids: [12, 13] }
      responses:
        '200':
          description: 重置成功，响应不含 `data`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/RequestTooLarge' }
        '429': { $ref: '#/components/responses/AuthLocked' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/RecoveryPending' }

  /api/access-keys/{id}/rpm:
    parameters:
      - $ref: '#/components/parameters/AccessKeyID'
    get:
      tags: [AccessKeys]
      operationId: getAccessKeyRPM
      summary: 最近一小时的 RPM 统计
      description: |
        统计所有网关实例上到达该 AccessKey RPM 闸门的请求，包括被 `rpm_limit` 拒绝的请求和不限速的 AccessKey。
        按分钟分桶，只保留最近一小时；`peak_rpm` 是 60 秒滑动窗口内请求数的最大值。
        这一小时内没有请求时省略 `peak_rpm` 和 `current`，`points` 为空数组。不接受查询参数。
      responses:
        '200':
          description: RPM 统计
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    required: [data]
                    properties:
                      data: { $ref: '#/components/schemas/RPMReport' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/AuthLocked' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/models:
    get:
      tags: [Models]
      operationId: listProjectModels
      summary: 分页查询模型总览
      description: |
        以客户端模型名（启用别名时为别名，否则为上游模型 ID）为根聚合全部分组模型，
        每个客户端模型给出它的统一价（`price`，未设置时为 `null`），并列出它能路由到的上游模型及其上游价格、
        路由分组和目录参考信息。
        条目按 `client_model` 升序。只接受下列查询参数，出现其他参数或同一参数重复时返回 `400 BAD_REQUEST`。

        **允许 `access_key` 身份调用**，此时：
        - `group_status` 固定为 `enabled`，合法的传入值被忽略；
        - 只包含该密钥 `filters` 允许访问的分组、协议与模型，`protocols` 也按密钥过滤；
        - `route_groups`、`affected_groups` 恒为空数组，只返回被分组引用的价格；
        - 上游价格是网关成本：`upstream_models[].price` 只保留渠道与定价状态，`prices` 各项为 `null`，
          `context_tiers` 为 `[]`，`mode_schedules` 为 `{}`，`method`、`matched_provider_id`、`match_source` 为 `null`。
      security:
        - adminBearer: []
        - accessKeyBearer: []
      parameters:
        - name: group_status
          in: query
          description: '`enabled` 只统计启用的分组；`all` 包含停用分组。'
          schema: { type: string, enum: [enabled, all], default: enabled }
        - name: pricing_status
          in: query
          description: 按上游模型的定价状态过滤；某客户端模型下的上游模型全部被过滤掉时，该客户端模型不出现。
          schema: { type: string, enum: [pending, configured, all], default: all }
        - name: q
          in: query
          description: |
            大小写不敏感的包含匹配，首尾空白会被去除。匹配范围：客户端模型名、上游模型 ID、渠道 ID、
            目录模型名、目录供应商 ID/名称、路由分组名。
          schema: { type: string, maxLength: 200 }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: page_size
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    required: [data]
                    properties:
                      data: { $ref: '#/components/schemas/ProjectModelCollection' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/AuthLocked' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/models/profile:
    get:
      tags: [Models]
      operationId: getClientModelProfile
      summary: 查询客户端模型的 Codex 模型目录资料
      description: |
        返回网关向 Codex 客户端下发模型目录时使用的资料：按内置目录模板自动推断的值（`automatic`）、
        管理员保存的覆盖（`overrides`）和二者合并后的生效值（`effective`）。
        只接受一个 `model` 查询参数，出现其他参数、参数重复或模型名首尾有空白时返回 `400 BAD_REQUEST`；
        模型未被任何分组引用时返回 `404 NOT_FOUND`。
      security:
        - adminBearer: []
      parameters:
        - name: model
          in: query
          required: true
          description: 客户端模型名。
          schema: { type: string }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    required: [data]
                    properties:
                      data: { $ref: '#/components/schemas/ClientModelProfileResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/AuthLocked' }
        '500': { $ref: '#/components/responses/InternalError' }
    put:
      tags: [Models]
      operationId: updateClientModelProfile
      summary: 保存客户端模型的 Codex 模型目录覆盖（整体替换）
      description: |
        `overrides` 整体替换已保存的覆盖，省略的字段回到自动值；传 `{}` 即删除全部覆盖。
        客户端模型必须被某个分组引用，否则返回 `404 NOT_FOUND`。
        保存后立即发布配置，其他实例经集群配置同步重新加载。不接受查询参数。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [client_model, overrides]
              properties:
                client_model: { type: string }
                overrides: { $ref: '#/components/schemas/ClientModelOverrides' }
            example:
              client_model: gpt-5.5
              overrides: { display_name: GPT-5.5, context_window: 400000 }
      responses:
        '200':
          description: 保存后的模型资料
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    required: [data]
                    properties:
                      data: { $ref: '#/components/schemas/ClientModelProfileResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/AuthLocked' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/RecoveryPending' }

  /api/client-model-prices:
    put:
      tags: [ModelPrices]
      operationId: putClientModelPrice
      summary: 设置客户端模型的统一价（新建或整体替换）
      description: |
        统一价是调用方被收取的价格，按客户端模型名生效，与路由到哪个分组、渠道、上游模型无关。
        客户端模型名可能含 `/`，所以放在请求体里。保存后立即发布价格表，其他实例经集群配置同步重新加载。

        - 字段规则与 `PUT /api/model-prices/{id}` 相同，但统一价没有「标记为不计费」：
          四个基础价格至少要有一项非 `null`，`confirm_unpriced` 只能为 `false`。
        - `mode_schedules` 可配置任意合法模式（不与目录比对），`fast` 不支持阶梯。
        - 不提供删除接口：未设置统一价即为待定价。不接受查询参数。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClientModelPriceRequest' }
            example:
              client_model: claude-sonnet
              input: '3'
              output: '15'
              cache_read: '0.3'
              cache_write: '3.75'
              context_tiers: []
              mode_schedules: {}
      responses:
        '200':
          description: 保存后的统一价
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    required: [data]
                    properties:
                      data: { $ref: '#/components/schemas/ClientModelPrice' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { $ref: '#/components/responses/RequestTooLarge' }
        '429': { $ref: '#/components/responses/AuthLocked' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/RecoveryPending' }

  /api/models/discover:
    post:
      tags: [ModelDiscovery]
      operationId: discoverDraftModels
      summary: 用草稿连接发现模型
      description: |
        在创建分组前，用尚未保存的渠道连接调用上游模型列表接口，返回候选模型。不写入任何数据。

        - `api_key` 连接：传 `credentials`，按顺序逐个尝试，第一个成功的结果即返回；不可传 `staged_credential_id`。
        - `subscription` 连接：传 `staged_credential_id`（已完成授权的暂存凭据），不可传 `credentials`。

        上游请求总超时 30 秒，最多翻 20 页、20000 个模型；全部凭据都失败时返回 `502 BAD_GATEWAY`。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ModelDiscoveryRequest' }
            example:
              channel_id: openai
              connection_type: api_key
              params: {}
              credentials:
                - fields: { api_key: sk-xxxx }
                  concurrency_limit: 0
      responses:
        '200':
          description: 候选模型
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    required: [data]
                    properties:
                      data: { $ref: '#/components/schemas/ModelDiscoveryResult' }
        '400':
          description: |
            `INVALID_JSON` / `VALIDATION_FAILED`（渠道、连接类型、参数、代理或凭据不合法；
            凭据字段错误时 `data` 为 `CredentialValidationData`）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/CredentialValidationData' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: '`NOT_FOUND`：`staged_credential_id` 对应的暂存凭据不存在'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '409':
          description: |
            `STAGED_CREDENTIAL_NOT_READY` / `STAGED_CREDENTIAL_MISMATCH` /
            `CREDENTIAL_REAUTHORIZATION_REQUIRED` / `CREDENTIAL_AUTH_OUTCOME_UNKNOWN`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '410':
          description: '`STAGED_CREDENTIAL_EXPIRED`：暂存凭据已过期'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '413': { $ref: '#/components/responses/RequestTooLarge' }
        '429': { $ref: '#/components/responses/AuthLocked' }
        '500': { $ref: '#/components/responses/InternalError' }
        '502': { $ref: '#/components/responses/BadGateway' }
        '503':
          description: '`CREDENTIAL_REFRESH_TEMPORARILY_UNAVAILABLE`：订阅凭据刷新暂时不可用'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /api/model-prices:
    get:
      tags: [ModelPrices]
      operationId: listModelPrices
      summary: 分页查询上游价格
      description: |
        上游价格只用于计算上游费用（网关成本）；调用方被收取的费用由客户端模型统一价决定，见 `PUT /api/client-model-prices`。
        价格按「渠道 + 上游模型 ID」唯一。排序：待定价优先，其次被引用优先，再按 `model_id`、`channel_id`、`id` 升序。
        只接受下列查询参数，出现其他参数或同一参数重复时返回 `400 BAD_REQUEST`。
      parameters:
        - name: usage
          in: query
          description: '`in_use` 被分组引用；`unreferenced` 未被引用；`all` 全部。'
          schema: { type: string, enum: [in_use, unreferenced, all], default: in_use }
        - name: status
          in: query
          schema: { type: string, enum: [pending, configured, all], default: all }
        - name: search
          in: query
          description: 按 `model_id` 或 `channel_id` 做大小写不敏感的包含匹配；首尾空白会被去除。
          schema: { type: string, maxLength: 200 }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: page_size
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: object
                        required: [items, pagination]
                        properties:
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/ModelPrice' }
                          pagination: { $ref: '#/components/schemas/Pagination' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/AuthLocked' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/model-prices/sync:
    post:
      tags: [ModelPrices]
      operationId: syncModelPrices
      summary: 手动同步 models.dev 价格目录
      description: |
        立即从 models.dev 拉取模型目录并对账自动价格（`method=auto_sync` 的条目），手工价格不受影响。
        手动触发不受「自动同步」开关限制；已有同步在进行时，等待并返回该次结果。
        不接受查询参数，不读取请求体。
      responses:
        '200':
          description: 同步完成（含目录未变化 `not_modified=true`）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    required: [data]
                    properties:
                      data: { $ref: '#/components/schemas/CatalogSyncStatus' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/AuthLocked' }
        '500': { $ref: '#/components/responses/InternalError' }
        '502':
          description: '`BAD_GATEWAY`：同步失败，`data` 为本次同步状态（`error_code=catalog_sync_failed`）'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/CatalogSyncStatus' }

  /api/model-prices/{id}:
    parameters:
      - $ref: '#/components/parameters/ModelPriceID'
    get:
      tags: [ModelPrices]
      operationId: getUpstreamModelDetail
      summary: 获取上游模型价格详情
      description: |
        返回价格编辑器所需的完整视图：价格本身、目录参考，以及引用该价格的全部「客户端模型 + 分组」关联。
        不受模型总览的分页、搜索、启用状态、定价状态过滤影响，停用分组也会列出。不接受查询参数。
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    required: [data]
                    properties:
                      data: { $ref: '#/components/schemas/UpstreamModelDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/AuthLocked' }
        '500': { $ref: '#/components/responses/InternalError' }
    put:
      tags: [ModelPrices]
      operationId: updateModelPrice
      summary: 手工设置模型价格（整体替换）
      description: |
        整体替换价格，保存后变为手工价格（`can_reset=true`），之后的目录同步不再覆盖它。

        - `input`、`output`、`cache_read`、`cache_write`、`context_tiers`、`mode_schedules` 都必须出现；
          价格槽传 `null` 表示该项不计费，数组和对象不可为 `null`。
        - 四个价格槽、所有分档价格都为 `null` 且 `mode_schedules` 为空时，表示「标记为不计费」，
          必须同时传 `confirm_unpriced: true`，否则返回 `409 MODEL_PRICE_UNPRICED_CONFIRMATION_REQUIRED`。
        - `mode_schedules` 的模式集合必须与现有价格一致，仅 `ultrafast` 可以新增或移除。
        - 不接受查询参数。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ModelPriceUpdateRequest' }
            example:
              input: '3'
              output: '15'
              cache_read: '0.3'
              cache_write: '3.75'
              context_tiers:
                - { threshold_tokens: 200000, input: '6', output: '22.5', cache_read: '0.6', cache_write: '7.5' }
              mode_schedules: {}
      responses:
        '200':
          description: 更新后的价格
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    required: [data]
                    properties:
                      data: { $ref: '#/components/schemas/ModelPrice' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`MODEL_PRICE_UNPRICED_CONFIRMATION_REQUIRED`：标记为不计费需要 `confirm_unpriced: true`，`data` 为 `{id}`'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ModelPriceIDData' }
        '413': { $ref: '#/components/responses/RequestTooLarge' }
        '429': { $ref: '#/components/responses/AuthLocked' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/RecoveryPending' }
    delete:
      tags: [ModelPrices]
      operationId: deleteModelPrice
      summary: 删除模型价格
      description: 只能删除未被任何分组引用的手工价格（即 `can_delete=true`）。不接受查询参数。
      responses:
        '200':
          description: 删除成功，响应不含 `data`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            `MODEL_PRICE_REFERENCED`：仍被分组引用，`data` 为 `{id, reference_count, reference_group_count}`；
            `MODEL_PRICE_AUTOMATIC_DELETE_FORBIDDEN`：自动价格不可手动删除，`data` 为 `{id}`
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorEnvelope'
                  - type: object
                    properties:
                      data:
                        anyOf:
                          - $ref: '#/components/schemas/ModelPriceReferenceData'
                          - $ref: '#/components/schemas/ModelPriceIDData'
        '429': { $ref: '#/components/responses/AuthLocked' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/RecoveryPending' }

  /api/model-prices/{id}/reset:
    parameters:
      - $ref: '#/components/parameters/ModelPriceID'
    post:
      tags: [ModelPrices]
      operationId: resetModelPrice
      summary: 恢复为目录自动价格
      description: |
        丢弃手工价格，按当前 models.dev 目录重新匹配自动价格；目录中没有匹配项时，价格全部清空并变为待定价。
        请求体可省略或为 `{}`，不接受查询参数。
      requestBody:
        required: false
        content:
          application/json:
            schema: { type: object, additionalProperties: false }
      responses:
        '200':
          description: 重置后的价格
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    required: [data]
                    properties:
                      data: { $ref: '#/components/schemas/ModelPrice' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/RequestTooLarge' }
        '429': { $ref: '#/components/responses/AuthLocked' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/RecoveryPending' }

  /api/groups/{group_id}/models:
    parameters:
      - $ref: '#/components/parameters/GroupID'
    get:
      tags: [GroupModels]
      operationId: getGroupModels
      summary: 获取分组模型列表
      description: 按保存顺序返回分组的模型配置及各模型的定价状态。
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    required: [data]
                    properties:
                      data: { $ref: '#/components/schemas/GroupModels' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/AuthLocked' }
        '500': { $ref: '#/components/responses/InternalError' }
    put:
      tags: [GroupModels]
      operationId: updateGroupModels
      summary: 替换分组模型列表
      description: |
        用 `models` 整体替换分组的模型列表（可为空数组）。`id`、`alias` 会去除首尾空白；
        `alias_enabled=false` 时 `alias` 被丢弃。同一分组内多个上游模型 ID 可以共用一个客户端模型名，
        请求该名称时在所选凭据可用的模型之间轮询；客户端模型名与上游 ID 完全相同的重复条目会被去重。
        上游模型 ID 集合发生变化时，会在后台触发一次价格目录同步。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [models]
              properties:
                models:
                  type: array
                  items: { $ref: '#/components/schemas/GroupModelInput' }
            example:
              models:
                - { id: gpt-4o, alias: '', alias_enabled: false }
                - { id: claude-sonnet-4-5-20250929, alias: claude-sonnet, alias_enabled: true }
      responses:
        '200':
          description: 替换后的模型列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    required: [data]
                    properties:
                      data: { $ref: '#/components/schemas/GroupModels' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/RequestTooLarge' }
        '429': { $ref: '#/components/responses/AuthLocked' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503':
          description: '`CONTROL_RECOVERY_PENDING` / `CONTROL_OPERATION_INCOMPLETE`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /api/groups/{group_id}/models/discover:
    parameters:
      - $ref: '#/components/parameters/GroupID'
    post:
      tags: [ModelDiscovery]
      operationId: discoverGroupModels
      summary: 用已保存分组发现模型
      description: |
        使用分组已保存的连接和启用中的凭据调用上游模型列表接口，返回候选模型，不修改分组。
        按凭据 ID 顺序逐个尝试，第一个成功的结果即返回；超时与分页上限同草稿发现接口。
        请求体可省略或为 `{}`。
      requestBody:
        required: false
        content:
          application/json:
            schema: { type: object, additionalProperties: false }
      responses:
        '200':
          description: 候选模型
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    required: [data]
                    properties:
                      data: { $ref: '#/components/schemas/ModelDiscoveryResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            `NO_ACTIVE_CREDENTIAL`：分组没有启用中的凭据；订阅分组还可能返回
            `CREDENTIAL_REAUTHORIZATION_REQUIRED` / `CREDENTIAL_AUTH_OUTCOME_UNKNOWN`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '413': { $ref: '#/components/responses/RequestTooLarge' }
        '429': { $ref: '#/components/responses/AuthLocked' }
        '500': { $ref: '#/components/responses/InternalError' }
        '502': { $ref: '#/components/responses/BadGateway' }
        '503':
          description: '`CREDENTIAL_REFRESH_TEMPORARILY_UNAVAILABLE`：订阅凭据刷新暂时不可用'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

components:
  securitySchemes:
    adminBearer:
      type: http
      scheme: bearer
      description: 管理员密钥，即服务端环境变量 `AUTH_KEY` 的值。
    accessKeyBearer:
      type: http
      scheme: bearer
      description: 启用中的 AccessKey，仅可访问只读白名单接口；受该密钥的 `allowed_cidrs` 约束。

  parameters:
    AccessKeyID:
      name: id
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    ModelPriceID:
      name: id
      in: path
      required: true
      description: 模型价格 ID。
      schema: { type: integer, minimum: 1, maximum: 9007199254740991 }
    GroupID:
      name: group_id
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { $ref: '#/components/schemas/IdempotencyKey' }

  headers:
    NoStore:
      description: 响应含密钥明文，禁止缓存。
      schema: { type: string, const: no-store }

  responses:
    BadRequest:
      description: '`BAD_REQUEST` / `INVALID_JSON` / `VALIDATION_FAILED`'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Unauthorized:
      description: '`UNAUTHORIZED`：缺少或无效的 Bearer token'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Forbidden:
      description: '`FORBIDDEN`：AccessKey 身份无权访问该接口'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    NotFound:
      description: '`NOT_FOUND`：资源不存在'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    IdempotencyKeyReused:
      description: '`IDEMPOTENCY_KEY_REUSED`：同一 Idempotency-Key 已用于不同请求'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    IdempotencyExpired:
      description: '`IDEMPOTENCY_RESULT_EXPIRED`：该 Idempotency-Key 的结果已过保留期'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    IdempotencyKeyRequired:
      description: '`IDEMPOTENCY_KEY_REQUIRED`：缺少 Idempotency-Key 请求头'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    RequestTooLarge:
      description: '`REQUEST_TOO_LARGE`：请求体超过 32 MiB'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    AuthLocked:
      description: '`AUTH_LOCKED`：来源 IP 认证失败过多，暂时锁定'
      headers:
        Retry-After:
          schema: { type: integer, minimum: 1 }
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorEnvelope'
              - type: object
                properties:
                  data:
                    type: object
                    required: [retry_after_seconds]
                    properties:
                      retry_after_seconds: { type: integer, minimum: 1 }
    InternalError:
      description: '`INTERNAL_SERVER_ERROR` / `DATABASE_ERROR`'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    BadGateway:
      description: '`BAD_GATEWAY`：上游请求失败或超时'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    RecoveryPending:
      description: '`CONTROL_RECOVERY_PENDING`：之前已提交的操作仍在恢复，稍后重试'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    OperationIncomplete:
      description: |
        `CONTROL_RECOVERY_PENDING`：之前已提交的操作仍在恢复，稍后重试；
        `CONTROL_OPERATION_INCOMPLETE`：本次操作已提交但运行时恢复未完成，可用同一 Idempotency-Key 重试
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  schemas:
    SuccessEnvelope:
      type: object
      required: [code, message]
      properties:
        code: { type: integer, const: 0 }
        message: { type: string }
        data: {}

    ErrorEnvelope:
      type: object
      required: [code, message]
      properties:
        code: { type: string, examples: [VALIDATION_FAILED] }
        message: { type: string }
        data: {}

    IdempotencyKey:
      type: string
      description: 小写规范 UUID v4。
      pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
      examples: [3f2b8c1e-9a4d-4e6f-8b2a-1c3d5e7f9a0b]

    AccessKeyStatus:
      type: string
      enum: [active, disabled]

    Protocol:
      type: string
      enum:
        - openai-completions
        - openai-responses
        - openai-images
        - openai-embeddings
        - rerank
        - anthropic
        - gemini
        - decisions

    AccessKeyPlaintext:
      type: string
      description: 可打印 ASCII（0x21–0x7E，不含空格），1–256 字节，不能等于 `AUTH_KEY`。
      minLength: 1
      maxLength: 256
      pattern: '^[!-~]+$'

    AccessKeyName:
      type: string
      description: |
        去除首尾空白后非空，不超过 255 字节，不含控制字符。
        `ly:` 与 `ly:default:` 前缀有约定含义，见「灵影镜像密钥」。
      minLength: 1
      maxLength: 255

    AccessKeyNote:
      type: string
      description: |
        备注，去除首尾空白后不超过 500 个字符（按 Unicode 字符计），可含换行；空串表示无备注。
        灵影镜像密钥的备注是灵影写入的 EchoJoyAuth 用户 ID，手动修改 `ly:default:` 密钥的备注会使它与用户脱钩。
      maxLength: 500

    PriceMultiplier:
      type: string
      description: |
        计费倍率，非负十进制字符串，最多 6 位小数，范围 0–1000。
        AccessKey 的倍率只乘费用（统一价的计价结果），不影响上游费用；分组倍率只乘上游费用。
      pattern: '^[0-9]+(\.[0-9]{1,6})?$'
      examples: ['1', '0.8']

    MoneyAmount:
      type: string
      description: 金额十进制字符串，最多 9 位小数；币种见同一对象或响应中的 `currency`。
      pattern: '^[0-9]+(\.[0-9]{1,9})?$'
      examples: ['5', '12.5']

    CurrencyCode:
      type: string
      description: ISO 4217 币种代码。
      enum: [USD, CNY]

    SystemCurrency:
      type: object
      required: [currency, exchange_rate]
      properties:
        currency: { $ref: '#/components/schemas/CurrencyCode' }
        exchange_rate:
          type: string
          description: 1 USD 兑换的系统货币数量，最多 6 位小数。
          examples: ['1', '7.1']

    AccessKeyFilters:
      type: object
      description: 数据面访问范围。各数组为空表示不限制。
      additionalProperties: false
      properties:
        groups:
          type: array
          description: 允许访问的分组 ID，必须是已存在的分组；重复项会去重。
          items: { type: integer, minimum: 1 }
        protocols:
          type: array
          description: 允许的入口协议；输出时按固定协议顺序排列。
          items: { $ref: '#/components/schemas/Protocol' }
        models:
          type: array
          description: 允许的模型名；首尾空白会被去除，不能为空串。
          items: { type: string, minLength: 1 }
        allowed_cidrs:
          type: array
          description: |
            允许的来源 IP 或 CIDR，最多 64 条；单个 IP 视为 /32 或 /128。
            同时约束数据面调用和该 AccessKey 登录控制台。输出为规范化后排序的 CIDR。
          maxItems: 64
          items: { type: string, examples: [10.0.0.0/8, 203.0.113.7] }

    AccessKeyFiltersOutput:
      allOf:
        - $ref: '#/components/schemas/AccessKeyFilters'
        - type: object
          required: [groups, protocols, models, allowed_cidrs]

    CostLimitRuleInput:
      type: object
      additionalProperties: false
      required: [kind, limit]
      description: |
        `total`：累计总额，最多一条，不能带 `period_seconds`。
        `periodic`：周期额度，`period_seconds` 取值 60–31536000，同一周期不可重复，最多 10 条。
        `limit` 以系统货币计，必须大于 0。切换系统货币时，所有规则会按旧汇率 → 美元 → 新汇率换算，已用额度清零。
      properties:
        id:
          type: integer
          minimum: 1
          description: 仅更新接口可用，表示保留并修改该已有规则；`kind` 不可变。
        kind: { type: string, enum: [total, periodic] }
        limit: { $ref: '#/components/schemas/MoneyAmount' }
        period_seconds: { type: integer, minimum: 60, maximum: 31536000 }

    CostLimitRule:
      type: object
      required: [id, kind, currency, limit]
      properties:
        id: { type: integer }
        kind: { type: string, enum: [total, periodic] }
        currency: { $ref: '#/components/schemas/CurrencyCode' }
        limit: { $ref: '#/components/schemas/MoneyAmount' }
        period_seconds:
          type: integer
          description: 仅 `periodic` 规则返回。

    CostLimitRuleStatus:
      allOf:
        - $ref: '#/components/schemas/CostLimitRule'
        - type: object
          required: [used, remaining, status]
          properties:
            used: { $ref: '#/components/schemas/MoneyAmount' }
            remaining: { $ref: '#/components/schemas/MoneyAmount' }
            status: { type: string, enum: [available, inactive, exhausted] }
            window_started_at_ms: { type: integer }
            window_ends_at_ms: { type: integer }

    CostLimitStatus:
      type: object
      required: [observed_at_ms, allowed, recoverable, next_available_at_ms, rules]
      properties:
        observed_at_ms: { type: integer }
        allowed:
          type: boolean
          description: 当前是否允许发起新请求。
        recoverable:
          type: boolean
          description: 被拦截时是否会随周期滚动自动恢复。
        next_available_at_ms: { type: [integer, 'null'] }
        rules:
          type: array
          items: { $ref: '#/components/schemas/CostLimitRuleStatus' }

    AccessKeyCreateRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { $ref: '#/components/schemas/AccessKeyName' }
        note:
          allOf:
            - $ref: '#/components/schemas/AccessKeyNote'
          default: ''
        key:
          allOf:
            - $ref: '#/components/schemas/AccessKeyPlaintext'
          description: 自定义密钥；省略或空串则由服务端生成。
        status:
          allOf:
            - $ref: '#/components/schemas/AccessKeyStatus'
          default: active
        price_multiplier:
          allOf:
            - $ref: '#/components/schemas/PriceMultiplier'
          default: '1'
          description: 不可为 `null`。
        filters: { $ref: '#/components/schemas/AccessKeyFilters' }
        rpm_limit:
          type: integer
          minimum: 0
          default: 0
          description: 每分钟请求上限，0 表示不限；不可为 `null`。
        cost_limit_rules:
          type: array
          description: 不可带 `id`；不可为 `null`。
          items: { $ref: '#/components/schemas/CostLimitRuleInput' }
        expires_at_ms:
          type: [integer, 'null']
          description: 过期时间，必须晚于当前时间；省略或 `null` 表示永不过期。

    AccessKeyUpdateRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { $ref: '#/components/schemas/AccessKeyName' }
        note:
          allOf:
            - $ref: '#/components/schemas/AccessKeyNote'
          description: 空串表示清空备注。
        key:
          allOf:
            - $ref: '#/components/schemas/AccessKeyPlaintext'
          description: 替换为自定义密钥；需要 `Idempotency-Key`。
        status: { $ref: '#/components/schemas/AccessKeyStatus' }
        price_multiplier: { $ref: '#/components/schemas/PriceMultiplier' }
        filters: { $ref: '#/components/schemas/AccessKeyFilters' }
        rpm_limit: { type: integer, minimum: 0 }
        cost_limit_rules:
          type: array
          items: { $ref: '#/components/schemas/CostLimitRuleInput' }
        expires_at_ms:
          type: [integer, 'null']
          description: 新的过期时间，必须晚于当前时间；`null` 表示改为永不过期。

    AccessKeyMetadata:
      type: object
      required:
        - id
        - name
        - note
        - masked_key
        - status
        - price_multiplier
        - filters
        - rpm_limit
        - cost_limit_rules
        - expires_at_ms
        - created_at_ms
        - updated_at_ms
      properties:
        id: { type: integer }
        name: { type: string }
        note:
          type: string
          description: 备注；未设置时为空串。
        masked_key:
          type: string
          description: |
            掩码密钥：超过 16 个字符时为前 6 位 + `****` + 末 4 位（如 `sk-gl-****ab12`）；
            9–16 个字符时为 `****` + 末 4 位；不超过 8 个字符时为 `********`。
          examples: [sk-gl-****ab12]
        status: { $ref: '#/components/schemas/AccessKeyStatus' }
        price_multiplier: { $ref: '#/components/schemas/PriceMultiplier' }
        filters: { $ref: '#/components/schemas/AccessKeyFiltersOutput' }
        rpm_limit: { type: integer }
        cost_limit_rules:
          type: array
          items: { $ref: '#/components/schemas/CostLimitRule' }
        cost_limit_status:
          allOf:
            - $ref: '#/components/schemas/CostLimitStatus'
          description: 仅列表接口和按 ID 获取接口在存在费用规则时返回。
        expires_at_ms: { type: [integer, 'null'] }
        created_at_ms: { type: integer }
        updated_at_ms: { type: integer }

    AccessKeySecretResult:
      description: 创建或轮换结果。
      allOf:
        - $ref: '#/components/schemas/AccessKeyMetadata'
        - type: object
          required: [replayed]
          properties:
            key:
              type: string
              description: 密钥明文，仅首次成功响应返回；幂等重放时省略。
            replayed:
              type: boolean
              description: 是否为同一 Idempotency-Key 的重放结果。

    AccessKeyRevealResult:
      type: object
      required: [id, key, revealed_at_ms]
      properties:
        id: { type: integer }
        key: { type: string }
        revealed_at_ms: { type: integer }

    AccessKeyOption:
      type: object
      required: [id, name, status, key_suffix]
      properties:
        id: { type: integer }
        name: { type: string }
        status: { $ref: '#/components/schemas/AccessKeyStatus' }
        key_suffix:
          type: string
          description: 密钥末 4 位；密钥长度不超过 8 时为 `****`。

    UsageAggregate:
      type: object
      required: [request_count, total_tokens, estimated_cost_nano, estimated_cost_nano_usd]
      properties:
        request_count: { type: integer }
        total_tokens: { type: integer }
        estimated_cost_nano:
          type: string
          description: 以 `usage_window.currency` 结算的估算费用，单位 1e-9 该币种；其他币种结算的费用不计入。
        estimated_cost_nano_usd:
          type: string
          description: 全部估算费用的美元合计，单位 1e-9 美元。

    AccessKeyCollectionItem:
      allOf:
        - $ref: '#/components/schemas/AccessKeyMetadata'
        - type: object
          required: [usage, last_request_at_ms, expired]
          properties:
            usage:
              allOf:
                - $ref: '#/components/schemas/UsageAggregate'
              description: '`usage_window` 区间内的用量。'
            last_request_at_ms:
              type: [integer, 'null']
              description: 最近一次请求完成时间；从未使用时为 `null`。
            expired:
              type: boolean

    AccessKeyCollection:
      type: object
      required: [usage_window, summary, items, pagination]
      properties:
        usage_window:
          type: object
          required: [observed_at_ms, range, from_ms, to_ms, currency]
          properties:
            observed_at_ms: { type: integer }
            range: { type: string, const: 7d }
            from_ms: { type: integer }
            to_ms: { type: integer }
            currency: { $ref: '#/components/schemas/CurrencyCode' }
        summary:
          type: object
          description: 全量统计，不受筛选条件影响。
          required: [total, active, disabled]
          properties:
            total: { type: integer }
            active: { type: integer }
            disabled: { type: integer }
        items:
          type: array
          items: { $ref: '#/components/schemas/AccessKeyCollectionItem' }
        pagination: { $ref: '#/components/schemas/Pagination' }

    RPMCounter:
      type: object
      required: [requests, rejected]
      properties:
        requests: { type: integer, minimum: 0 }
        rejected: { type: integer, minimum: 0, description: 被 `rpm_limit` 拒绝的请求数 }
    RPMReport:
      type: object
      required: [from_ms, to_ms, observed_at_ms, bucket_width_ms, requests, rejected, points]
      properties:
        from_ms: { type: integer }
        to_ms: { type: integer }
        observed_at_ms: { type: integer }
        bucket_width_ms: { type: integer, const: 60000 }
        current:
          allOf:
            - $ref: '#/components/schemas/RPMCounter'
          description: 截至 `observed_at_ms` 的 60 秒滑动窗口。
        peak_rpm: { type: integer, minimum: 0 }
        requests: { type: integer, minimum: 0 }
        rejected: { type: integer, minimum: 0 }
        points:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/RPMCounter'
              - type: object
                required: [bucket_start_ms, peak_rpm]
                properties:
                  bucket_start_ms: { type: integer }
                  peak_rpm: { type: integer, minimum: 0 }
    Pagination:
      type: object
      required: [page, page_size, total_items, total_pages]
      properties:
        page: { type: integer }
        page_size: { type: integer }
        total_items:
          type: integer
          description: 筛选后的条目总数。
        total_pages: { type: integer }

    PricingStatus:
      type: string
      description: '`pending` 待定价（无任何价格且非手工设置）；`configured` 已定价或已手工标记为不计费。'
      enum: [pending, configured]

    PricePerMillion:
      type: [string, 'null']
      description: |
        每百万 token 的价格，以所属对象的 `currency`（系统货币）计，非负十进制字符串，最多 9 位小数；
        `null` 表示该项不计费。价格以美元保存，读写时按当前汇率换算；读回规则见文首「约定」。
      pattern: '^[0-9]+(\.[0-9]{1,9})?$'
      examples: ['3', '0.075']

    PriceSlots:
      type: object
      required: [input, output, cache_read, cache_write]
      properties:
        input: { $ref: '#/components/schemas/PricePerMillion' }
        output: { $ref: '#/components/schemas/PricePerMillion' }
        cache_read: { $ref: '#/components/schemas/PricePerMillion' }
        cache_write: { $ref: '#/components/schemas/PricePerMillion' }

    ContextTier:
      type: object
      description: 输入 token 数达到 `threshold_tokens` 后改用该档价格。
      required: [threshold_tokens, prices]
      properties:
        threshold_tokens: { type: integer, minimum: 0 }
        prices: { $ref: '#/components/schemas/PriceSlots' }

    ModeSchedule:
      type: object
      required: [prices, context_tiers]
      properties:
        prices: { $ref: '#/components/schemas/PriceSlots' }
        context_tiers:
          type: array
          items: { $ref: '#/components/schemas/ContextTier' }

    PricingMode:
      type: string
      description: |
        非标准计费模式名，如 `fast`、`ultrafast`；不可为 `standard`。`fast` 不支持分档价格。
        上游价格（`PUT /api/model-prices/{id}`）的模式集合不可增删，`ultrafast` 除外；统一价不限。
      minLength: 1
      maxLength: 64
      pattern: '^[a-z0-9]([a-z0-9_-]*[a-z0-9])?$'

    ModelPrice:
      type: object
      description: 上游价格：某渠道上游模型的价格，用于计算上游费用，不决定向调用方收取的费用。
      required:
        - id
        - channel_id
        - channel_name
        - channel_mark
        - channel_icon
        - model_id
        - currency
        - prices
        - mode_schedules
        - pricing_status
        - method
        - matched_provider_id
        - match_source
        - referenced
        - reference_count
        - reference_group_count
        - context_tiers
        - updated_at_ms
        - can_reset
        - can_delete
      properties:
        id: { type: integer }
        channel_id: { type: string, examples: [openai] }
        channel_name: { type: string }
        channel_mark:
          type: string
          description: 渠道简写标记，前端在缺少图标时用作占位。
        channel_icon:
          type: string
          description: 前端图标资源名，默认等于渠道 ID。
        model_id:
          type: string
          description: 上游模型 ID。
        currency: { $ref: '#/components/schemas/CurrencyCode' }
        prices: { $ref: '#/components/schemas/PriceSlots' }
        mode_schedules:
          type: object
          description: 按模式的独立价格，键为 `PricingMode`；没有时为 `{}`。
          propertyNames: { $ref: '#/components/schemas/PricingMode' }
          additionalProperties: { $ref: '#/components/schemas/ModeSchedule' }
        pricing_status: { $ref: '#/components/schemas/PricingStatus' }
        method:
          type: [string, 'null']
          description: |
            `auto_sync` 来自 models.dev 目录自动匹配；`user_set` 手工设置；
            `user_marked_unpriced` 手工标记为不计费；自动价格尚未匹配到目录时为 `null`。
          enum: [auto_sync, user_set, user_marked_unpriced, null]
        matched_provider_id:
          type: [string, 'null']
          description: 自动价格匹配到的 models.dev 供应商 ID；手工价格或未匹配时为 `null`。
        match_source:
          type: [string, 'null']
          description: |
            `channel_catalog_provider` 来自渠道对应的目录供应商；
            `provider_priority_fallback` 按供应商优先级回退匹配；未匹配时为 `null`。
          enum: [channel_catalog_provider, provider_priority_fallback, null]
        referenced: { type: boolean }
        reference_count:
          type: integer
          description: 引用该价格的分组模型条目数（含停用分组）。
        reference_group_count:
          type: integer
          description: 引用该价格的分组数（含停用分组）。
        context_tiers:
          type: array
          items: { $ref: '#/components/schemas/ContextTier' }
        updated_at_ms: { type: integer }
        can_reset:
          type: boolean
          description: 是否为手工价格，可恢复为目录自动价格。
        can_delete:
          type: boolean
          description: 手工价格且未被引用时为 `true`。

    ModelPriceIDData:
      type: object
      required: [id]
      properties:
        id: { type: integer }

    ModelPriceReferenceData:
      type: object
      required: [id, reference_count, reference_group_count]
      properties:
        id: { type: integer }
        reference_count: { type: integer }
        reference_group_count: { type: integer }

    ContextTierInput:
      type: object
      additionalProperties: false
      description: |
        请求中的分档价格字段是平铺的（响应中嵌套在 `prices` 下）。
        `threshold_tokens` 必须是 JSON 整数且严格递增；每档至少一个价格非 `null`。
      required: [threshold_tokens]
      properties:
        threshold_tokens: { type: integer, minimum: 0, maximum: 9007199254740991 }
        input: { $ref: '#/components/schemas/PricePerMillion' }
        output: { $ref: '#/components/schemas/PricePerMillion' }
        cache_read: { $ref: '#/components/schemas/PricePerMillion' }
        cache_write: { $ref: '#/components/schemas/PricePerMillion' }

    ModeScheduleInput:
      type: object
      additionalProperties: false
      required: [prices, context_tiers]
      properties:
        prices:
          type: object
          additionalProperties: false
          description: 四个价格槽都必须出现，且至少一个非 `null`。
          required: [input, output, cache_read, cache_write]
          properties:
            input: { $ref: '#/components/schemas/PricePerMillion' }
            output: { $ref: '#/components/schemas/PricePerMillion' }
            cache_read: { $ref: '#/components/schemas/PricePerMillion' }
            cache_write: { $ref: '#/components/schemas/PricePerMillion' }
        context_tiers:
          type: array
          description: '`fast` 模式必须为空数组。'
          items: { $ref: '#/components/schemas/ContextTierInput' }

    ModelPriceUpdateRequest:
      type: object
      additionalProperties: false
      required: [input, output, cache_read, cache_write, context_tiers, mode_schedules]
      properties:
        input: { $ref: '#/components/schemas/PricePerMillion' }
        output: { $ref: '#/components/schemas/PricePerMillion' }
        cache_read: { $ref: '#/components/schemas/PricePerMillion' }
        cache_write: { $ref: '#/components/schemas/PricePerMillion' }
        context_tiers:
          type: array
          items: { $ref: '#/components/schemas/ContextTierInput' }
        mode_schedules:
          type: object
          propertyNames: { $ref: '#/components/schemas/PricingMode' }
          additionalProperties: { $ref: '#/components/schemas/ModeScheduleInput' }
        confirm_unpriced:
          type: boolean
          default: false
          description: 确认将该模型标记为不计费；仅在所有价格都为 `null` 时需要。

    ClientModelPriceRequest:
      type: object
      additionalProperties: false
      description: 价格字段与 `ModelPriceUpdateRequest` 相同；四个基础价格至少一项非 `null`。
      required: [client_model, input, output, cache_read, cache_write, context_tiers, mode_schedules]
      properties:
        client_model:
          type: string
          description: 客户端模型名，1–255 字节，不能有首尾空白或控制字符。
        input: { $ref: '#/components/schemas/PricePerMillion' }
        output: { $ref: '#/components/schemas/PricePerMillion' }
        cache_read: { $ref: '#/components/schemas/PricePerMillion' }
        cache_write: { $ref: '#/components/schemas/PricePerMillion' }
        context_tiers:
          type: array
          items: { $ref: '#/components/schemas/ContextTierInput' }
        mode_schedules:
          type: object
          propertyNames: { $ref: '#/components/schemas/PricingMode' }
          additionalProperties: { $ref: '#/components/schemas/ModeScheduleInput' }
        confirm_unpriced:
          type: boolean
          enum: [false]
          default: false
          description: 统一价不能标记为不计费，只接受 `false`。

    ClientModelPrice:
      type: object
      description: 统一价：调用方被收取的价格，按客户端模型名对所有分组和渠道生效。
      required: [client_model, currency, prices, context_tiers, mode_schedules, updated_at_ms]
      properties:
        client_model: { type: string }
        currency: { $ref: '#/components/schemas/CurrencyCode' }
        prices: { $ref: '#/components/schemas/PriceSlots' }
        context_tiers:
          type: array
          items: { $ref: '#/components/schemas/ContextTier' }
        mode_schedules:
          type: object
          propertyNames: { $ref: '#/components/schemas/PricingMode' }
          additionalProperties: { $ref: '#/components/schemas/ModeSchedule' }
        updated_at_ms: { type: integer }

    CatalogSyncStatus:
      type: object
      required: [trigger, checked_at_ms, successful_fetch_at_ms, not_modified, skipped]
      properties:
        trigger:
          type: string
          enum: [startup, periodic, group_change, settings_change, manual]
        checked_at_ms: { type: integer }
        successful_fetch_at_ms:
          type: integer
          description: 最近一次成功拉取目录的时间；从未成功时为 0。
        not_modified:
          type: boolean
          description: 目录自上次拉取后未变化。
        skipped:
          type: boolean
          description: 自动同步开关关闭导致的跳过；手动同步恒为 `false`。
        error_code:
          type: string
          description: 失败时为 `catalog_sync_failed`；成功时省略。

    ProjectModelGroup:
      type: object
      required: [id, name, channel_id, params, enabled, client_protocols]
      properties:
        id: { type: integer }
        name: { type: string }
        channel_id: { type: string }
        params:
          type: object
          description: 分组的渠道参数（规范化后）；AccessKey 身份下恒为 `{}`。
        enabled: { type: boolean }
        client_protocols:
          type: array
          items: { $ref: '#/components/schemas/Protocol' }

    CatalogModel:
      type: object
      description: models.dev 目录中的模型元数据；未知的字符串字段为空串，未知的布尔/数值字段为 `null`。
      required: [id, name, description, family, capabilities, modalities, limits, knowledge, release_date, last_updated, open_weights, status]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        family: { type: string }
        capabilities:
          type: object
          required: [attachment, reasoning, tool_call, structured_output, temperature]
          properties:
            attachment: { type: [boolean, 'null'] }
            reasoning: { type: [boolean, 'null'] }
            tool_call: { type: [boolean, 'null'] }
            structured_output: { type: [boolean, 'null'] }
            temperature: { type: [boolean, 'null'] }
        modalities:
          type: object
          required: [input, output]
          properties:
            input: { type: array, items: { type: string } }
            output: { type: array, items: { type: string } }
        limits:
          type: object
          required: [context, input, output]
          properties:
            context: { type: [integer, 'null'] }
            input: { type: [integer, 'null'] }
            output: { type: [integer, 'null'] }
        knowledge: { type: string }
        release_date: { type: string }
        last_updated: { type: string }
        open_weights: { type: [boolean, 'null'] }
        status: { type: string }

    CatalogReference:
      type: [object, 'null']
      description: 匹配到的 models.dev 目录条目；目录未加载或无匹配时为 `null`。
      required: [source, provider_id, provider_name, model]
      properties:
        source:
          type: string
          description: '`actual_provider` 来自渠道对应的目录供应商；`reference_provider` 来自其他供应商的参考数据。'
          enum: [actual_provider, reference_provider]
        provider_id: { type: string }
        provider_name: { type: string }
        model: { $ref: '#/components/schemas/CatalogModel' }

    ProjectUpstreamModel:
      type: object
      required: [model_id, alias_applied, price, route_groups, affected_groups, catalog_reference]
      properties:
        model_id: { type: string }
        alias_applied:
          type: boolean
          description: 客户端模型名是否来自别名。
        price: { $ref: '#/components/schemas/ModelPrice' }
        route_groups:
          type: array
          description: 该客户端模型经由哪些分组路由到此上游模型，按名称、ID 排序。
          items: { $ref: '#/components/schemas/ProjectModelGroup' }
        affected_groups:
          type: array
          description: 引用同一价格的全部分组（修改价格会影响它们）。
          items: { $ref: '#/components/schemas/ProjectModelGroup' }
        catalog_reference: { $ref: '#/components/schemas/CatalogReference' }

    ProjectModel:
      type: object
      required: [client_model, price, has_overrides, protocols, upstream_models]
      properties:
        client_model:
          type: string
          description: 客户端请求时使用的模型名。
        has_overrides:
          type: boolean
          description: 是否为该客户端模型保存了 Codex 模型目录的手动覆盖，见 `GET /api/models/profile`。
        price:
          oneOf:
            - $ref: '#/components/schemas/ClientModelPrice'
            - type: 'null'
          description: 统一价；未设置时为 `null`，该模型的请求费用按未定价处理。
        protocols:
          type: array
          description: 可用的入口协议，按固定协议顺序排列。
          items: { $ref: '#/components/schemas/Protocol' }
        upstream_models:
          type: array
          description: 按 `model_id`、`price.channel_id` 升序。
          items: { $ref: '#/components/schemas/ProjectUpstreamModel' }

    ClientModelProfile:
      type: object
      required: [display_name, context_window, supported_reasoning_levels, input_modalities]
      properties:
        display_name: { type: string }
        context_window:
          type: [integer, 'null']
          description: 上下文窗口 tokens；模板未提供时为 `null`。
        supported_reasoning_levels:
          type: array
          items: { type: string, enum: [none, minimal, low, medium, high, xhigh, max, ultra, persistent] }
        input_modalities:
          type: array
          items: { type: string, enum: [text, image, audio] }

    ClientModelOverrides:
      type: object
      additionalProperties: false
      description: 只包含被覆盖的字段；省略的字段使用自动值。
      properties:
        display_name: { type: string, maxLength: 512, description: '非空白 UTF-8 文本，最长 512 字节。' }
        context_window: { type: integer, minimum: 1, maximum: 9007199254740991 }
        supported_reasoning_levels:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string, enum: [none, minimal, low, medium, high, xhigh, max, ultra, persistent] }
        input_modalities:
          type: array
          uniqueItems: true
          description: 必须包含 `text`。
          items: { type: string, enum: [text, image, audio] }

    ClientModelProfileResponse:
      type: object
      required: [client_model, automatic, overrides, effective, has_overrides]
      properties:
        client_model: { type: string }
        automatic: { $ref: '#/components/schemas/ClientModelProfile' }
        overrides: { $ref: '#/components/schemas/ClientModelOverrides' }
        effective: { $ref: '#/components/schemas/ClientModelProfile' }
        has_overrides: { type: boolean }

    ProjectModelCollection:
      type: object
      required: [summary, catalog, items, pagination]
      properties:
        summary:
          type: object
          description: 按 `group_status` 统计，不受 `pricing_status`、`q`、分页影响。
          required: [client_model_count, upstream_model_count, price_count, pending_price_count, unreferenced_price_count]
          properties:
            client_model_count: { type: integer }
            upstream_model_count: { type: integer }
            price_count: { type: integer }
            pending_price_count: { type: integer }
            unreferenced_price_count:
              type: integer
              description: 未被任何分组引用的价格数；AccessKey 身份下恒为 0。
        catalog:
          type: object
          description: models.dev 目录状态。
          required: [available, checked_at_ms, successful_fetch_at_ms, error_code]
          properties:
            available:
              type: boolean
              description: 当前是否有可用的目录快照。
            checked_at_ms: { type: integer }
            successful_fetch_at_ms: { type: integer }
            error_code:
              type: string
              description: 最近一次同步失败时为 `catalog_sync_failed`，否则为空串。
        items:
          type: array
          items: { $ref: '#/components/schemas/ProjectModel' }
        pagination: { $ref: '#/components/schemas/Pagination' }

    UpstreamModelDetail:
      type: object
      required: [model_id, price, catalog_reference, associations, client_model_count, group_count]
      properties:
        model_id: { type: string }
        price: { $ref: '#/components/schemas/ModelPrice' }
        catalog_reference: { $ref: '#/components/schemas/CatalogReference' }
        associations:
          type: array
          description: 按客户端模型名、分组名、分组 ID 排序。
          items:
            type: object
            required: [client_model, alias_applied, group]
            properties:
              client_model: { type: string }
              alias_applied: { type: boolean }
              group: { $ref: '#/components/schemas/ProjectModelGroup' }
        client_model_count: { type: integer }
        group_count: { type: integer }

    GroupModelInput:
      type: object
      additionalProperties: false
      required: [id, alias_enabled]
      properties:
        id:
          type: string
          description: 上游模型 ID，去除首尾空白后非空。
          minLength: 1
        alias:
          type: string
          description: 客户端可见的别名；`alias_enabled=true` 时去除首尾空白后必须非空。
        alias_enabled: { type: boolean }

    GroupModel:
      type: object
      required: [id, alias, alias_enabled, client_model, pricing_status]
      properties:
        id: { type: string }
        alias:
          type: string
          description: 未启用别名时为空串。
        alias_enabled: { type: boolean }
        client_model:
          type: string
          description: 启用别名时为 `alias`，否则为 `id`。
        pricing_status: { $ref: '#/components/schemas/PricingStatus' }

    GroupModels:
      type: object
      required: [items, total, pending]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/GroupModel' }
        total: { type: integer }
        pending:
          type: integer
          description: 待定价的模型数。

    CredentialEntryInput:
      type: object
      additionalProperties: false
      required: [fields]
      properties:
        fields:
          type: object
          description: '渠道定义的凭据字段，如 `{"api_key": "..."}`；字段集合见 `GET /api/channels`。'
          additionalProperties: { type: string }
        concurrency_limit:
          type: integer
          minimum: 0
          maximum: 10000
          default: 0
          description: 单凭据并发上限，0 表示不限。

    OutboundProxyConfig:
      type: object
      additionalProperties: false
      required: [mode]
      description: 出站代理。发现接口只接受 `direct` 与 `custom`；仅支持代理的渠道可传。
      properties:
        mode: { type: string, enum: [direct, custom] }
        url:
          type: string
          description: '`custom` 时必填的代理地址；`direct` 时不可传。'

    ModelDiscoveryRequest:
      type: object
      additionalProperties: false
      required: [channel_id, connection_type]
      properties:
        channel_id:
          type: string
          description: 渠道 ID，取值见 `GET /api/channels`。
        connection_type:
          type: string
          description: 必须与该渠道的连接类型一致。
          enum: [api_key, subscription]
        params:
          type: object
          description: 渠道参数，按渠道定义校验。
        credentials:
          type: array
          description: '`api_key` 连接必填，1–500 条；同一凭据重复出现时去重。'
          minItems: 1
          maxItems: 500
          items: { $ref: '#/components/schemas/CredentialEntryInput' }
        staged_credential_id:
          type: string
          description: '`subscription` 连接必填：已完成授权的暂存凭据 ID。'
        proxy: { $ref: '#/components/schemas/OutboundProxyConfig' }

    CredentialValidationData:
      type: object
      description: 凭据校验失败的位置。
      required: [entry, field, reason_code]
      properties:
        entry:
          type: integer
          minimum: 1
          description: '`credentials` 中的序号（从 1 开始）。'
        field: { type: string, examples: [concurrency_limit] }
        reason_code: { type: string, examples: [invalid_value, conflicting_value] }

    ModelCandidate:
      type: object
      required: [id, name, sources, pricing_status, pricing_source]
      properties:
        id: { type: string }
        name:
          type: string
          description: 目录中有名称时为目录名称，否则为 `id`。
        sources:
          type: array
          description: '`live` 上游实时返回；`catalog` 存在于该渠道的 models.dev 目录。'
          items: { type: string, enum: [live, catalog] }
        pricing_status: { $ref: '#/components/schemas/PricingStatus' }
        pricing_source:
          type: [string, 'null']
          description: 自动价格来源的目录供应商名称；手工价格或无目录价格时为 `null`。

    ModelDiscoveryResult:
      type: object
      required: [models]
      properties:
        models:
          type: array
          description: 先列上游实时返回的模型（保持上游顺序），再列仅存在于目录的模型（按名称排序）。
          items: { $ref: '#/components/schemas/ModelCandidate' }
