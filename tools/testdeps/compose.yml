# 测试依赖：`make test` 与 `make check` 通过它拉起 PostgreSQL 和 Redis。
# 数据只放在内存盘并关闭 fsync，仅供测试使用；端口只绑定本机回环地址。
name: gpt-load-testdeps

services:
  postgres:
    image: postgres:18-alpine
    # 迁移校验反复查询 information_schema 视图，规划是测试库最主要的 CPU 开销；
    # 收紧 join/from_collapse_limit、关闭 hash/merge join 可以缩短这类视图的规划时间。
    # 测试数据量很小，嵌套循环足以应对业务查询。
    command: ["postgres", "-c", "fsync=off", "-c", "synchronous_commit=off", "-c", "full_page_writes=off", "-c", "max_connections=500", "-c", "jit=off", "-c", "join_collapse_limit=1", "-c", "from_collapse_limit=1", "-c", "enable_hashjoin=off", "-c", "enable_mergejoin=off"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gpt_load
      # 只绑定回环地址的测试库，免去每个测试连接的 SCRAM 握手。
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql:rw,nosuid,nodev,size=2g
    healthcheck:
      test: pg_isready -U postgres -d gpt_load
      interval: 2s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7.4-alpine
    ports:
      - "127.0.0.1:56379:6379"
    healthcheck:
      test: redis-cli ping
      interval: 2s
      timeout: 5s
      retries: 30
