name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

# 竖线分隔在任何错误（含网络错误）时回退到下一个源；默认的逗号只在
# 404/410 时回退，proxy.golang.org 瞬时故障会直接让整个 job 失败。
# 自托管 Runner 保留本机 Go 缓存；代码与编译参数变化由 Go 自动判定失效。
# 不再下载/上传 setup-go 缓存，也无需 main push 预热。
env:
  GOPROXY: https://proxy.golang.org|direct

concurrency:
  group: ci-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate and build web UI
        uses: ./.github/actions/web-ci

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Check Go formatting
        run: |
          # go-format-check:start
          formatted_files="$(gofmt -l .)"
          test -z "${formatted_files}"
          # go-format-check:end

      - name: Check module graph
        run: go mod tidy -diff

      - name: Check embedded CPA bridge module
        working-directory: third_party/cpaembedded
        run: |
          go mod tidy -diff
          go vet ./...

      - name: Run Go vet
        run: go vet ./...

      - name: Build backend
        run: go build -o gpt-load .

      - name: Check repository invariants
        run: git diff --check

  race-tests:
    runs-on: [self-hosted, Linux, ARM64]
    timeout-minutes: 20
    # 业务测试跑在真实 PostgreSQL 与 Redis 上；GitHub services 只支持 Linux runner。
    # 数据库只用内存盘，每个实例按实际使用量占用，最多 2 GiB。
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gpt_load
        ports:
          - 5432
        options: >-
          --tmpfs /var/lib/postgresql:rw,nosuid,nodev,size=2g
          --health-cmd="pg_isready -U postgres -d gpt_load"
          --health-interval=5s
          --health-timeout=10s
          --health-retries=20
      redis:
        image: redis:7
        ports:
          - 6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=10s
          --health-retries=20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Run race-enabled tests
        env:
          GPT_LOAD_DATABASE_TEST_DSN: postgres://postgres:postgres@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/gpt_load?sslmode=disable
          GPT_LOAD_REDIS_TEST_ADDR: 127.0.0.1:${{ job.services.redis.ports['6379'] }}
        run: go test -race -vet=off -count=1 -timeout=15m . ./internal/... ./tools/...

  race-cpa:
    runs-on: [self-hosted, Linux, ARM64]
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Run embedded CPA bridge race-enabled tests
        working-directory: third_party/cpaembedded
        run: go test -race -count=1 -timeout=15m ./...

  # 在 docker-compose.cluster.yml 样例上运行集群验收：真实 3 节点 Redis Cluster
  # 上的合同测试，以及 RPM、成本额度、配置传播与 WebSocket 经 nginx 的确定性检查。
  cluster-e2e:
    runs-on: [self-hosted, Linux, ARM64]
    timeout-minutes: 40
    env:
      COMPOSE_PROJECT_NAME: gl-e2e-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # override 使用 `!reset` 与 env_file.required，需要 Compose v2.24+。
      - name: Check Docker Compose
        run: docker compose version

      - name: Run cluster acceptance
        run: make cluster-e2e

      - name: Remove acceptance images
        if: always()
        run: docker image rm -f "gpt-load:${COMPOSE_PROJECT_NAME}" "gpt-load-clusterbench:${COMPOSE_PROJECT_NAME}" >/dev/null 2>&1 || true
